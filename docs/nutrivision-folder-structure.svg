<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1420" viewBox="0 0 2200 1420" role="img" aria-labelledby="title description">
  <title id="title">NutriVision generic lib architecture</title>
  <desc id="description">A generic feature-first Clean Architecture blueprint for the lib folder, showing application composition, shared core folders, and the layers inside any feature.</desc>
  <style>
    .bg { fill: #f7f3e8; }
    .panel { fill: #fffdf8; stroke: #d7dfd2; stroke-width: 2; }
    .card-data { fill: #edf5ed; stroke: #9fbea5; stroke-width: 2; }
    .card-domain { fill: #fff5df; stroke: #d8bb78; stroke-width: 2; }
    .card-presentation { fill: #eaf1f8; stroke: #9db7cf; stroke-width: 2; }
    .accent { fill: #e8f0e5; stroke: #b8cdbb; stroke-width: 1.5; }
    .title { fill: #164a3b; font: 700 38px Arial, sans-serif; }
    .panel-title { fill: #164a3b; font: 700 24px Arial, sans-serif; }
    .section { fill: #2f735d; font: 700 17px Arial, sans-serif; }
    .layer-title { fill: #164a3b; font: 700 21px Arial, sans-serif; }
    .tree { fill: #263b34; font: 14px Consolas, 'Courier New', monospace; }
    .small-tree { fill: #263b34; font: 13px Consolas, 'Courier New', monospace; }
    .note { fill: #6d7d75; font: 13px Arial, sans-serif; }
    .rule { fill: #164a3b; font: 700 14px Arial, sans-serif; }
    .line { stroke: #b8cdbb; stroke-width: 1.5; }
    .soft-arrow { stroke: #87a995; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f735d"/>
    </marker>
  </defs>

  <rect class="bg" width="2200" height="1420"/>
  <text x="60" y="64" class="title">NutriVision Generic Feature-First Architecture</text>
  <text x="60" y="101" class="note">Reusable blueprint for the application source inside lib/</text>
  <rect x="50" y="130" width="2100" height="62" rx="14" class="accent"/>
  <text x="78" y="168" class="rule">Screen / Widget → Bloc or Cubit → Use Case → Repository Contract → Repository Implementation → Data Source</text>

  <!-- lib tree -->
  <rect x="50" y="230" width="600" height="1125" rx="18" class="panel"/>
  <text x="80" y="278" class="panel-title">lib/</text>
  <line x1="80" y1="298" x2="620" y2="298" class="line"/>

  <text x="84" y="338" class="section">Application composition</text>
  <text x="92" y="368" class="tree">├── main.dart</text>
  <text x="92" y="392" class="tree">└── app/</text>
  <text x="108" y="416" class="tree">├── app.dart</text>
  <text x="108" y="440" class="tree">├── observer/</text>
  <text x="124" y="464" class="tree">└── app_bloc_observer.dart</text>
  <text x="108" y="488" class="tree">└── router/app_router.dart</text>

  <text x="84" y="536" class="section">Shared foundation</text>
  <text x="92" y="566" class="tree">└── core/</text>
  <text x="108" y="590" class="tree">├── constants/</text>
  <text x="108" y="614" class="tree">├── config/</text>
  <text x="108" y="638" class="tree">├── errors/</text>
  <text x="108" y="662" class="tree">├── network/</text>
  <text x="108" y="686" class="tree">├── storage/</text>
  <text x="108" y="710" class="tree">├── theme/</text>
  <text x="108" y="734" class="tree">├── utils/</text>
  <text x="108" y="758" class="tree">└── widgets/</text>

  <text x="84" y="806" class="section">Feature modules</text>
  <text x="92" y="836" class="tree">└── features/</text>
  <text x="108" y="860" class="tree">├── auth/</text>
  <text x="108" y="884" class="tree">├── onboarding/</text>
  <text x="108" y="908" class="tree">├── home/</text>
  <text x="108" y="932" class="tree">├── profile/</text>
  <text x="108" y="956" class="tree">├── nutrition/</text>
  <text x="108" y="980" class="tree">├── meals/</text>
  <text x="108" y="1004" class="tree">├── ai_assistant/</text>
  <text x="108" y="1028" class="tree">├── recommendations/</text>
  <text x="108" y="1052" class="tree">├── splash/</text>
  <text x="108" y="1076" class="tree">└── welcome/</text>

  <rect x="84" y="1120" width="532" height="170" rx="12" class="accent"/>
  <text x="108" y="1154" class="rule">Scope of this blueprint</text>
  <text x="108" y="1182" class="note">Only lib/ source architecture is shown.</text>
  <text x="108" y="1207" class="note">Platform folders and unrelated project areas</text>
  <text x="108" y="1232" class="note">are intentionally not part of the feature map.</text>

  <!-- generic feature -->
  <rect x="690" y="230" width="1460" height="1125" rx="18" class="panel"/>
  <text x="720" y="278" class="panel-title">lib/features/&lt;feature&gt;/</text>
  <text x="720" y="306" class="note">Every feature owns its data, domain, and presentation code.</text>
  <line x1="720" y1="326" x2="2120" y2="326" class="line"/>

  <rect x="720" y="370" width="390" height="690" rx="16" class="card-data"/>
  <text x="750" y="416" class="layer-title">data/</text>
  <text x="750" y="446" class="note">How data is obtained</text>
  <line x1="750" y1="466" x2="1080" y2="466" class="line"/>
  <text x="750" y="506" class="small-tree">├── repositories/</text>
  <text x="766" y="530" class="small-tree">└── concrete impl.</text>
  <text x="750" y="574" class="small-tree">├── models/</text>
  <text x="766" y="598" class="small-tree">└── DTOs / mappers</text>
  <text x="750" y="642" class="small-tree">└── datasources/</text>
  <text x="766" y="666" class="small-tree">└── API / storage</text>
  <rect x="750" y="720" width="330" height="210" rx="10" fill="#fffdf8" opacity="0.75"/>
  <text x="770" y="752" class="rule">Responsibilities</text>
  <text x="770" y="782" class="note">• implement domain contracts</text>
  <text x="770" y="812" class="note">• map external data</text>
  <text x="770" y="842" class="note">• hide API/storage details</text>
  <text x="770" y="872" class="note">• expose stable failures</text>

  <rect x="1175" y="370" width="390" height="690" rx="16" class="card-domain"/>
  <text x="1205" y="416" class="layer-title">domain/</text>
  <text x="1205" y="446" class="note">What the feature means</text>
  <line x1="1205" y1="466" x2="1535" y2="466" class="line"/>
  <text x="1205" y="506" class="small-tree">├── entities/</text>
  <text x="1221" y="530" class="small-tree">└── business models</text>
  <text x="1205" y="574" class="small-tree">├── repositories/</text>
  <text x="1221" y="598" class="small-tree">└── abstract contracts</text>
  <text x="1205" y="642" class="small-tree">└── usecases/</text>
  <text x="1221" y="666" class="small-tree">└── one action each</text>
  <rect x="1205" y="720" width="330" height="210" rx="10" fill="#fffdf8" opacity="0.75"/>
  <text x="1225" y="752" class="rule">Responsibilities</text>
  <text x="1225" y="782" class="note">• business entities</text>
  <text x="1225" y="812" class="note">• abstract contracts</text>
  <text x="1225" y="842" class="note">• business actions</text>
  <text x="1225" y="872" class="note">• no Flutter imports</text>

  <rect x="1630" y="370" width="490" height="690" rx="16" class="card-presentation"/>
  <text x="1660" y="416" class="layer-title">presentation/</text>
  <text x="1660" y="446" class="note">How the user interacts</text>
  <line x1="1660" y1="466" x2="2090" y2="466" class="line"/>
  <text x="1660" y="506" class="small-tree">├── bloc/</text>
  <text x="1676" y="530" class="small-tree">└── shared workflows</text>
  <text x="1660" y="574" class="small-tree">├── cubit/</text>
  <text x="1676" y="598" class="small-tree">└── local UI state</text>
  <text x="1660" y="642" class="small-tree">├── screens/</text>
  <text x="1676" y="666" class="small-tree">└── route-level screens</text>
  <text x="1660" y="710" class="small-tree">└── widgets/</text>
  <text x="1676" y="734" class="small-tree">└── feature components</text>
  <rect x="1660" y="780" width="430" height="210" rx="10" fill="#fffdf8" opacity="0.75"/>
  <text x="1680" y="812" class="rule">Responsibilities</text>
  <text x="1680" y="842" class="note">• render immutable state</text>
  <text x="1680" y="872" class="note">• dispatch events</text>
  <text x="1680" y="902" class="note">• listen for side effects</text>
  <text x="1680" y="932" class="note">• keep routes and screens thin</text>

  <path d="M 1110 1015 L 1165 1015" class="soft-arrow"/>
  <path d="M 1565 1015 L 1620 1015" class="soft-arrow"/>
  <rect x="720" y="1130" width="1400" height="150" rx="14" class="accent"/>
  <text x="750" y="1170" class="rule">Dependency direction</text>
  <text x="750" y="1202" class="note">Presentation uses domain contracts; data implements those contracts.</text>
  <text x="750" y="1232" class="note">The domain stays independent so the data source can change without rewriting the UI.</text>

  <text x="60" y="1392" class="note">NutriVision • Generic architecture blueprint • Add concrete files only when a feature needs them.</text>
</svg>
